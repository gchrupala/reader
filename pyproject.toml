[project]
name = "paperreader"
version = "0.1.0"
description = "Fetch and read research papers politely: open-access sources first, institutional access through your own browser session."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "pypdfium2>=4.30",
]

[project.optional-dependencies]
browser = ["playwright>=1.49"]
# Crops figures and tables out of PDFs. PyMuPDF is AGPL-3.0; without it, whole pages are rendered instead.
figures = ["pymupdf>=1.26"]

[project.scripts]
paper = "paperreader.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: hits real servers (deselect with -m 'not network')"]
addopts = "-m 'not network'"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
